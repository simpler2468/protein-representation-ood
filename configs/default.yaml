project:
  seed_list: [42, 43, 44]

data:
  table: data/processed/deeploc_multilabel.csv
  esm_embeddings: data/processed/esm2_t6_embeddings.npz
  mmseqs_hits: data/mmseqs/all_vs_all.tsv
  split_column: split_homology

graph:
  min_fident: 0.30
  min_coverage: 0.50
  top_k: 8

model:
  baseline_hidden_dim: 256
  attention_hidden_dim: 128
  correction_hidden_dim: 256
  dropout: 0.20

training:
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  baseline_batch_size: 256
  graph_batch_size: 128
  evaluation_batch_size: 256
  threshold_grid_start: 0.05
  threshold_grid_stop: 0.95
  threshold_grid_steps: 19
  num_threads: 8
  device: cpu

output:
  root: results

